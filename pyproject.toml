[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silvia"
version = "0.2.0"
description = "Local-first, governed software development with durable sessions"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "textual>=1,<7",
  "keyring>=25,<26",
]

[project.scripts]
silvia = "silvia.cli:main"
bai-workflow = "silvia.cli:legacy_main"

[tool.setuptools.packages.find]
include = ["silvia*", "workflow*"]

[tool.setuptools.package-data]
"silvia.storage" = ["*.sql"]
workflow = ["harness_templates.json"]