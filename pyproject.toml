[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bai-langchain-workflow"
version = "0.1.0"
description = "Parallel, SDD-gated implementation workflow using LangChain and the B.AI API"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
]

[project.scripts]
bai-workflow = "workflow.cli:main"

[tool.setuptools.packages.find]
include = ["workflow*"]
